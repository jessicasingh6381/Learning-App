name: PostgreSQL 16 Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql-compatibility:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: learning_app_postgresql_compatibility_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d learning_app_postgresql_compatibility_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, mbstring, xml, ctype, json, tokenizer, pdo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PostgreSQL compatibility tests
        run: vendor/bin/phpunit --configuration phpunit.postgresql.xml
